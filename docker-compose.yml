# ============================================================================
# docker-compose.yml — Identical infrastructure for every developer
#
# ONE COMMAND TO START EVERYTHING:
#   docker compose up -d
#
# PUBLIC APPLICATION ENTRY POINT:
#   API Gateway -> internal application services
#
# The application services intentionally have no host "ports:" mappings.
# They remain reachable through the Docker network, but are not published
# directly on the developer machine/host.
# ============================================================================

services:

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: cityapp-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
    profiles:
      - core
    networks:
      - cityapp-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cityapp-gateway
    ports:
      - "8085:8000"
    environment:
      - EUREKA_HOST=${EUREKA_HOST:?Set EUREKA_HOST in .env}
      - REDIS_HOST=${GATEWAY_REDIS_HOST:?Set GATEWAY_REDIS_HOST in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
      - LOGGING_LEVEL_COM_CITYAPP_GATEWAY=${LOGGING_LEVEL_COM_CITYAPP_GATEWAY:?Set LOGGING_LEVEL_COM_CITYAPP_GATEWAY in .env}
      - LOGGING_LEVEL_IO_JSONWEBTOKEN=${LOGGING_LEVEL_IO_JSONWEBTOKEN:?Set LOGGING_LEVEL_IO_JSONWEBTOKEN in .env}
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - cityapp-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cityapp-auth
    environment:
      - EUREKA_HOST=${EUREKA_HOST:?Set EUREKA_HOST in .env}
      - DB_URL=${AUTH_DB_URL:?Set AUTH_DB_URL in .env}
      - REDIS_HOST=${REDIS_HOST:?Set REDIS_HOST in .env}
      - KAFKA_BROKERS=${KAFKA_BROKERS:?Set KAFKA_BROKERS in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
      - DB_PASSWORD=${DB_PASSWORD}
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: cityapp-notification
    environment:
      - EUREKA_HOST=${EUREKA_HOST:?Set EUREKA_HOST in .env}
      - DB_URL=${AUTH_DB_URL:?Set AUTH_DB_URL in .env}
      - REDIS_HOST=${REDIS_HOST:?Set REDIS_HOST in .env}
      - KAFKA_BROKERS=${KAFKA_BROKERS:?Set KAFKA_BROKERS in .env}
      - MAIL_HOST=${MAIL_HOST:?Set MAIL_HOST in .env}
      - FIREBASE_CREDENTIALS_PATH=${APP_FCM_CREDENTIALS_PATH:-}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  main-service:
    build:
      context: ./city-app-backend
      dockerfile: Dockerfile
    container_name: cityapp-main
    environment:
      - EUREKA_HOST=${EUREKA_HOST:?Set EUREKA_HOST in .env}
      - SPRING_DATASOURCE_URL=${MAIN_DATASOURCE_URL:?Set MAIN_DATASOURCE_URL in .env}
      - REDIS_HOST=${REDIS_HOST:?Set REDIS_HOST in .env}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - LOGGING_LEVEL_COM_CITYAPP=${LOGGING_LEVEL_COM_CITYAPP:?Set LOGGING_LEVEL_COM_CITYAPP in .env}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:?Set LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY in .env}
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: cityapp-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER:     ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    profiles:
      - infra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityapp -d cityapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cityapp-network

  redis:
    image: redis:7-alpine
    container_name: cityapp-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    profiles:
      - infra
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cityapp-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cityapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:?Set ZOOKEEPER_CLIENT_PORT in .env}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:?Set ZOOKEEPER_TICK_TIME in .env}
    ports:
      - "2181:2181"
    profiles:
      - infra
    healthcheck:
      test: [ "CMD-SHELL", "cub zk-ready localhost:2181 10" ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - cityapp-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cityapp-kafka
    depends_on:
        zookeeper:
          condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    profiles:
      - infra
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:?Set KAFKA_BROKER_ID in .env}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:?Set KAFKA_ZOOKEEPER_CONNECT in .env}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:?Set KAFKA_LISTENERS in .env}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:?Set KAFKA_ADVERTISED_LISTENERS in .env}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:?Set KAFKA_LISTENER_SECURITY_PROTOCOL_MAP in .env}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:?Set KAFKA_INTER_BROKER_LISTENER_NAME in .env}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?Set KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR in .env}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:?Set KAFKA_AUTO_CREATE_TOPICS_ENABLE in .env}"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server",
             "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - cityapp-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cityapp-mailhog
    ports:
      - "1025:1025"
      - "8027:8025"
    profiles:
      - infra
    networks:
      - cityapp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cityapp-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    profiles:
      - tools
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTERS_0_NAME:?Set KAFKA_CLUSTERS_0_NAME in .env}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:?Set KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS in .env}
    networks:
      - cityapp-network

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: cityapp-zipkin
    ports:
      - "9411:9411"
    profiles:
      - monitoring
    networks:
      - cityapp-network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: cityapp-prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./city-app-backend/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - cityapp-network

  grafana:
    image: grafana/grafana:13.1.5
    container_name: cityapp-grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      # Never use a committed/default password. Configure this in the untracked .env file.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local .env before starting the monitoring profile}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cityapp-network

  loki:
    image: grafana/loki:2.9.0
    container_name: cityapp-loki
    ports:
      - "3100:3100"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cityapp-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: cityapp-promtail
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/logs:/var/log/app
      - ./city-app-backend/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml -log.level=debug
    depends_on:
      - loki
    networks:
      - cityapp-network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: cityapp-alertmanager
    ports:
      - "9093:9093"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: >
      --config.file=/etc/alertmanager/alertmanager.yml
      --storage.path=/alertmanager
    networks:
      - cityapp-network

volumes:
  loki_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  cityapp-network:
    driver: bridge
