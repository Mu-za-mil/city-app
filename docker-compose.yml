# ============================================================================
# docker-compose.yml — Identical infrastructure for every developer
#
# ONE COMMAND TO START EVERYTHING:
#   docker compose up -d
#
# PUBLIC APPLICATION ENTRY POINT:
#   API Gateway -> internal application services
#
# The application services intentionally have no host "ports:" mappings.
# They remain reachable through the Docker network, but are not published
# directly on the developer machine/host.
# ============================================================================

services:

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: cityapp-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    profiles:
      - core
    networks:
      - cityapp-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cityapp-gateway
    ports:
      - "8085:8000"
    environment:
      - EUREKA_HOST=eureka-server
      - REDIS_HOST=cityapp-redis
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=dev
      - LOGGING_LEVEL_COM_CITYAPP_GATEWAY=DEBUG
      - LOGGING_LEVEL_IO_JSONWEBTOKEN=DEBUG
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - cityapp-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cityapp-auth
    environment:
      - EUREKA_HOST=eureka-server
      - DB_URL=jdbc:postgresql://postgres:5432/cityapp
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PASSWORD=${DB_PASSWORD}
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: cityapp-notification
    environment:
      - EUREKA_HOST=eureka-server
      - DB_URL=jdbc:postgresql://postgres:5432/cityapp
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - MAIL_HOST=mailhog
      - FIREBASE_CREDENTIALS_PATH=${APP_FCM_CREDENTIALS_PATH:-}
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  main-service:
    build:
      context: ./city-app-backend
      dockerfile: Dockerfile
    container_name: cityapp-main
    environment:
      - EUREKA_HOST=eureka-server
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cityapp
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=dev
      - DB_PASSWORD=${DB_PASSWORD:-cityapp_password}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - LOGGING_LEVEL_COM_CITYAPP=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    profiles:
      - core
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cityapp-network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: cityapp-postgres
    environment:
      POSTGRES_DB:       cityapp
      POSTGRES_USER:     cityapp
      POSTGRES_PASSWORD: cityapp_password
    ports:
      - "5433:5432"
    profiles:
      - infra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityapp -d cityapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cityapp-network

  redis:
    image: redis:7-alpine
    container_name: cityapp-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    profiles:
      - infra
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cityapp-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cityapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    profiles:
      - infra
    healthcheck:
      test: [ "CMD-SHELL", "cub zk-ready localhost:2181 10" ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - cityapp-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cityapp-kafka
    depends_on:
        zookeeper:
          condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    profiles:
      - infra
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server",
             "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - cityapp-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cityapp-mailhog
    ports:
      - "1025:1025"
      - "8027:8025"
    profiles:
      - infra
    networks:
      - cityapp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cityapp-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    profiles:
      - tools
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - cityapp-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: cityapp-zipkin
    ports:
      - "9411:9411"
    profiles:
      - monitoring
    networks:
      - cityapp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: cityapp-prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./city-app-backend/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - cityapp-network

  grafana:
    image: grafana/grafana:latest
    container_name: cityapp-grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Never use a committed/default password. Configure this in the untracked .env file.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local .env before starting the monitoring profile}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cityapp-network

  loki:
    image: grafana/loki:2.9.0
    container_name: cityapp-loki
    ports:
      - "3100:3100"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cityapp-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: cityapp-promtail
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/logs:/var/log/app
      - ./city-app-backend/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml -log.level=debug
    depends_on:
      - loki
    networks:
      - cityapp-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: cityapp-alertmanager
    ports:
      - "9093:9093"
    profiles:
      - monitoring
    volumes:
      - ./city-app-backend/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: >
      --config.file=/etc/alertmanager/alertmanager.yml
      --storage.path=/alertmanager
    networks:
      - cityapp-network

volumes:
  loki_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  cityapp-network:
    driver: bridge
