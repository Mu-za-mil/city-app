# ============================================================================
# docker-compose.yml — Identical infrastructure for every developer
#
# ONE COMMAND TO START EVERYTHING:
#   docker compose up -d
#
# WHY DOCKER COMPOSE:
#   Developer A has PostgreSQL 14. Developer B has PostgreSQL 16.
#   Query works on B's machine. Silently fails on A's.
#   Docker Compose: everyone runs EXACTLY the same version.
#   "Works on my machine" becomes "works on every machine".
# ============================================================================

services:

  # ── Eureka Service Registry ───────────────────────────────────────────────
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: city-app-backend/Dockerfile
    container_name: cityapp-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - cityapp-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: city-app-backend/Dockerfile
    container_name: cityapp-gateway
    ports:
      - "8000:8000"
    environment:
      - EUREKA_HOST=eureka-server
      - REDIS_HOST=cityapp-redis
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - cityapp-network

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: city-app-backend/Dockerfile
    container_name: cityapp-auth
    ports:
      - "8081:8081"
    environment:
      - EUREKA_HOST=eureka-server
      - DB_URL=jdbc:postgresql://cityapp-postgres:5432/cityapp
      - REDIS_HOST=cityapp-redis
      - KAFKA_BROKERS=cityapp-kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - cityapp-network

  # ── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: city-app-backend/Dockerfile
    container_name: cityapp-notification
    ports:
      - "8083:8083"
    environment:
      - EUREKA_HOST=eureka-server
      - DB_URL=jdbc:postgresql://cityapp-postgres:5432/cityapp
      - REDIS_HOST=cityapp-redis
      - KAFKA_BROKERS=cityapp-kafka:9092
      - MAIL_HOST=cityapp-mailhog
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:}
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - cityapp-network

  # ── Main Service (Monolith — remaining modules) ───────────────────────────
  main-service:
    build:
      context: ./city-app-backend
      dockerfile: city-app-backend/Dockerfile
    container_name: cityapp-main
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
      - DB_URL=jdbc:postgresql://cityapp-postgres:5432/cityapp
      - REDIS_HOST=cityapp-redis
      - KAFKA_BROKERS=cityapp-kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - cityapp-network

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    # WHY postgis not plain postgres:
    # postgis/postgis includes the PostGIS spatial extension.
    # Switching images after data exists = complex migration.
    # Start with PostGIS from day one = zero migration cost later.
    container_name: cityapp-postgres
    environment:
      POSTGRES_DB:       cityapp
      POSTGRES_USER:     cityapp
      POSTGRES_PASSWORD: cityapp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Named volume: data persists between container restarts.
      # Without this: every docker compose down destroys all data.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityapp -d cityapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityapp-network

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # WHY alpine: 7MB image vs 50MB standard. Same functionality.
    container_name: cityapp-redis
    command: redis-server --appendonly yes
    # WHY appendonly yes:
    # Writes every operation to an append-only file (AOF) on disk.
    # Without it: Redis restart = empty Redis = all carts lost,
    # all JWT blacklists cleared, all OTPs gone.
    # With AOF: Redis recovers all data from the log on restart.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityapp-network

  # ── Zookeeper (Kafka Dependency) ───────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cityapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cityapp-network

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cityapp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # WHY auto create TRUE in dev: topics created automatically when first used.
      # In production: create topics manually with correct partition count.
      # 3 partitions = 3 parallel consumers. Plan for growth from the start.
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server",
             "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cityapp-network

  # ── MailHog (Email Trap) ───────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cityapp-mailhog
    ports:
      - "1025:1025"   # SMTP — Spring Mail connects here
      - "8025:8025"   # Web UI — view all sent emails
    # WHY MailHog:
    # In dev, we send real emails for order confirmations, OTPs.
    # Without MailHog: these emails go to real users' inboxes.
    # With MailHog: all emails are trapped and visible at localhost:8025.
    # Open browser → http://localhost:8025 → see every email the app sent.
    networks:
      - cityapp-network

  # ── Kafka UI ───────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cityapp-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    # WHY Kafka UI:
    # Without it: must use kafka-console-consumer command to see messages.
    # With it: browse topics, see message payloads, monitor consumer lag,
    # replay messages from DLT — all in a browser UI.
    networks:
      - cityapp-network

  # ── Zipkin (Distributed Tracing) ──────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: cityapp-zipkin
    ports:
      - "9411:9411"
    networks:
      - cityapp-network

  # ── Prometheus (Metrics Collection) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: cityapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - cityapp-network

  # ── Grafana (Metrics Dashboard) ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: cityapp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cityapp-network

  # ── Loki (Log Aggregation Backend) ───────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: cityapp-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cityapp-network

  # ── Promtail (Log Shipper) ────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cityapp-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/app     # Mount application log directory
    command: -config.file=/etc/promtail/config.yml -log.level=debug
    depends_on:
      - loki
    networks:
      - cityapp-network

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: cityapp-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: >
      --config.file=/etc/alertmanager/alertmanager.yml
      --storage.path=/alertmanager
    networks:
      - cityapp-network

volumes:
  loki_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:


networks:
  cityapp-network:
    driver: bridge
