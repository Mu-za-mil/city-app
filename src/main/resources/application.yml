spring:
  application:
    name: city-app-backend


  # ── DATABASE ────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cityapp}
    username: ${DB_USERNAME:cityapp}
    password: ${DB_PASSWORD:cityapp_password}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # WHY these numbers:
      # pool-size 25: handles 25 concurrent DB operations per JVM
      # idle-timeout 10min: close idle connections so DB isn't overwhelmed
      # max-lifetime 30min: prevents stale connections that PostgreSQL cleaned up

  jpa:
    open-in-view: false
    # ❌ NEVER set this to true in production.
    # WHY: true keeps the DB connection open for the ENTIRE HTTP request,
    # including time spent serialising JSON response.
    # At 500 concurrent requests = 500 connections held hostage.
    # Connection pool exhaustion = new requests hang = app appears frozen.
    hibernate:
      ddl-auto: validate
      # WHY validate not create/update:
      # 'create' drops all tables on restart (data loss in production)
      # 'update' silently modifies schema in unpredictable ways
      # 'validate' checks entities match DB schema, FAILS LOUDLY if not
      # Flyway manages all schema changes. Hibernate only validates.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
          # WHY UTC: Store all timestamps in UTC. Convert to user's timezone
          # in the application layer. Avoids "the order was at 11 PM but
          # shows as 5:30 AM" bugs when servers move between timezones.

  # ── FLYWAY ──────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # WHY validate-on-migrate: if someone edits a migration that already ran,
    # the checksum changes and Flyway refuses to start. Prevents silent
    # schema drift between environments.

  # ── REDIS ────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ── KAFKA ───────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      observation-enabled: true
      # Enable tracing for Kafka producers.
      # Spring Kafka: automatically injects B3 trace headers into every message.
      properties:
        spring.json.add.type.headers: true
        # WHY true: include the message type in Kafka headers so consumers
        # can deserialize JSON into the correct event class.
        acks: all
        # WHY all: wait for ALL in-sync replicas to acknowledge.
        # Without this: leader broker confirms → immediately crashes
        # before replicating → message permanently lost.
        linger.ms: 5
        # WHY linger.ms 5: wait 5ms before sending to batch multiple messages.
        # A small latency increase (5ms) for a significant throughput improvement.

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      # WHY false: commit offset manually after successful processing.
      # Auto-commit: message fetched → offset committed → processing fails
      #              → message is lost (offset already committed).
      # Manual: message fetched → processed → THEN commit offset
      #         → if processing fails → message redelivered.
      properties:
        spring.json.use.type.headers: true
        spring.json.value.default.type: "com.cityapp.common.event.UserRegisteredEvent"
        spring.json.trusted.packages: "com.cityapp.*"
        # SAGA SPECIFIC:
        max.poll.records: 10
          # max.poll.records: 10 events per poll for saga consumers.
          # WHY LOW: Saga consumers hold DB locks (SELECT FOR UPDATE).
          # Processing 100 events at once = 100 concurrent lock acquisitions.
          # Small batch = controlled lock pressure.

    listener:
      # Ack mode: MANUAL_IMMEDIATE — commit offset only after processing.
      # WHY NOT AUTO: Auto-commit commits offset before we finish processing.
      # Consumer crashes after auto-commit but before completing:
      # Message is lost (offset already committed).
      # MANUAL_IMMEDIATE: commit offset explicitly after processing.
      # If we forget to commit: message re-delivered on restart. Safe.
      ack-mode: BATCH
      # BATCH: commit after each batch is fully processed.
      # Simpler than MANUAL_IMMEDIATE. Slightly less granular.
      # For our saga consumers: batch of events, commit when all processed.
      concurrency: 3
      # 3 concurrent listener threads per topic.
      # Matches our 3 partitions per topic.
      # Each thread handles one partition. Maximum parallelism.
      observation-enabled: true
      # Enable tracing for Kafka consumers.
      # Spring Kafka: automatically extracts B3 headers from messages.
      # Creates child spans. Reports to Zipkin.

  # ── MAIL ────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # ── CACHE ───────────────────────────────────────────────────────────────
  cache:
    type: redis

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:

    # ── Circuit Breakers ─────────────────────────────────────────────────────────
    circuitbreaker:
      configs:
        # Default config (inherited by all circuit breakers unless overridden)
        default:
          slidingWindowType: COUNT_BASED
          # COUNT_BASED: circuit evaluates based on last N calls.
          # TIME_BASED: evaluates based on calls in last N seconds.
          # COUNT_BASED is simpler and more predictable for our use case.

          slidingWindowSize: 10
          # Evaluate the last 10 calls.
          # If 50% fail → circuit opens.

          failureRateThreshold: 50
          # 50%: if 5 of last 10 calls fail → OPEN.
          # WHY 50% not 100%: at 100%, you need 10 consecutive failures.
          # Real outages: alternating success/fail is more common.
          # 50%: circuit opens when the service is clearly struggling.

          slowCallRateThreshold: 80
          # If 80% of calls take longer than slowCallDurationThreshold → OPEN.
          # Slow calls are as damaging as failed calls (thread blocking).

          slowCallDurationThreshold: 3s
          # A call taking > 3 seconds is considered "slow."

          waitDurationInOpenState: 30s
          # Circuit stays OPEN for 30 seconds before testing recovery.
          # During OPEN state: all calls get the fallback immediately.
          # After 30s: transitions to HALF_OPEN (test mode).

          permittedNumberOfCallsInHalfOpenState: 3
          # HALF_OPEN: allow 3 test calls through to check if service recovered.
          # All 3 succeed: CLOSE (normal operation resumed).
          # Any fail: OPEN again (back to waiting 30 more seconds).

          registerHealthIndicator: true
          # Exposes circuit state at /actuator/health.
          # Kubernetes readiness probe: can remove pod from rotation if circuit open.

      instances:
        razorpay:
          baseConfig: default
          # Razorpay: payment gateway. External third-party.
          # Less tolerant of slowness (payment UX is critical).
          slowCallDurationThreshold: 3s
          waitDurationInOpenState: 30s
          failureRateThreshold: 40
          # Slightly more aggressive: open at 40% failure rate.
          # Payments are critical UX. Fail fast.

        fcm:
          baseConfig: default
          # FCM: push notifications. Can tolerate more failures (non-critical).
          failureRateThreshold: 80
          # 80%: push notifications are supplementary. Tolerate more failures.
          waitDurationInOpenState: 60s
          # Wait longer before retrying (FCM outages often last minutes).

        msg91:
          baseConfig: default
          # MSG91: SMS gateway. Similar to FCM.
          failureRateThreshold: 60
          waitDurationInOpenState: 60s

    # ── Retry ─────────────────────────────────────────────────────────────────────
    retry:
      configs:
        default:
          maxAttempts: 3
          # Total attempts: 3 (1 original + 2 retries).

          waitDuration: 500ms
          # Wait 500ms between retries.
          # With exponential backoff: 500ms, 1000ms, 2000ms.

          enableExponentialBackoff: true
          exponentialBackoffMultiplier: 2
          # Multiplier 2: each retry doubles the wait.
          # Why exponential: a struggling service needs time to recover.
          # Constant retries at 500ms add load to an already struggling service.
          # Exponential: reduces pressure over time.

          retryExceptions:
            - java.io.IOException
            - java.util.concurrent.TimeoutException
            - org.springframework.web.client.ResourceAccessException
          # Only retry on transient exceptions (network issues, timeouts).

          ignoreExceptions:
            - com.cityapp.common.exception.AppException
            # Never retry business exceptions.
            # AppException.badRequest("Email taken"): retrying won't help.
            # The DB will still have that email on the second attempt.

      instances:
        razorpay:
          baseConfig: default
          maxAttempts: 2
          # Only 2 attempts for payment (1 retry).
          # Why fewer: payment APIs must be idempotent on retry.
          # Razorpay: idempotency via order ID. Safe to retry.
          # But we're conservative: 2 attempts max.

    # ── Time Limiter ──────────────────────────────────────────────────────────────
    timelimiter:
      configs:
        default:
          timeoutDuration: 5s
          # Any call exceeding 5 seconds: TimeoutException thrown.
          # Combined with CircuitBreaker: counts as a slow call.
          cancelRunningFuture: true
          # Cancel the running Future when timeout occurs.
          # Without this: the thread continues running even after timeout.
          # Resources (threads, connections) not released.

      instances:
        razorpay:
          timeoutDuration: 3s
          # Tighter timeout for payments: 3 seconds max.
          # User is on the checkout page. 3 seconds feels long.
          # After 3 seconds: show "payment gateway unavailable" and fallback.

        fcm:
          timeoutDuration: 5s

  # ── APP CONFIG ───────────────────────────────────────────────────────────────
cityapp:
  jwt:
      secret: ${JWT_SECRET}
      # NO DEFAULT. App refuses to start if JWT_SECRET is not set.
      # A startup failure is infinitely better than running with a weak/known secret.
      access-token-expiration-ms: ${ACCESS_TOKEN_MS:900000}
      refresh-expiration-days: ${REFRESH_TOKEN_DAYS:30}

  cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

  outbox:
      poll-interval-ms: 5000
      batch-size: 100
      retention-days: 7

  websocket:
      redis-relay-enabled: ${WEBSOCKET_REDIS_RELAY:false}

  fcm:
    credentials-path: classpath:firebase-credentials.json

  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Disable in dev: easier testing without hitting limits.
    # application-dev.yml: enabled: false

    # Bucket definitions (token bucket algorithm)
    # Tokens: how many requests allowed in the window.
    # Refill: how fast tokens are replenished.

    # Login endpoint (most important to protect)
    login:
      capacity: 5          # max 5 attempts
      refill-tokens: 5     # replenish 5 tokens
      refill-seconds: 900  # every 15 minutes
      # Effect: 5 attempts per 15 minutes per IP+email.
      # Attacker: blocked after 5 wrong attempts.

    # Registration
    register:
      capacity: 3
      refill-tokens: 3
      refill-seconds: 3600  # 3 registrations per hour per IP

    # OTP sending (prevent SMS bombing)
    otp:
      capacity: 3
      refill-tokens: 3
      refill-seconds: 3600  # 3 OTPs per hour per phone number

    # General API (prevent scraping and abuse)
    api:
      capacity: 100
      refill-tokens: 100
      refill-seconds: 60  # 100 requests per minute per user

# ── ACTUATOR ─────────────────────────────────────────────────────────────────
management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus,metrics,env,circuitbreakers
    endpoint:
      health:
        show-details: always
        probes:
          enabled: true
          # WHY probes: Kubernetes calls /actuator/health/liveness and /readiness
          # separately. Liveness = JVM is alive (don't kill it).
          # Readiness = can serve traffic (is DB connected? Is Redis up?).
          # Combining them means a DB blip kills the pod unnecessarily.

        circuitbreakers:
          enabled: true
          # Include circuit breaker status in health checks.
          # Kubernetes readiness probe reads /actuator/health.
          # OPEN circuit → unhealthy → pod removed from load balancer rotation.
          # Traffic goes to other instances until circuit closes.

        # Resilience4j metrics in Prometheus format
        
        metrics:
          distribution:
            percentiles-histogram:
              resilience4j.circuitbreaker.calls: true

    tracing:
      sampling:
        probability: ${TRACE_SAMPLE_RATE:1.0}
    zipkin:
      tracing:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

  # ── LOGGING ──────────────────────────────────────────────────────────────────
logging:
    level:
      com.cityapp: INFO
      org.hibernate.SQL: OFF
      org.springframework.security: WARN
      org.springframework.cache: WARN
      io.github.resilience4j: DEBUG
      org.springframework.boot.context.properties: DEBUG


