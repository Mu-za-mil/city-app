name: City App CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-images:
    name: Verify Maven and build Docker images (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all Maven modules and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build API Gateway image
        run: docker build --tag "city-app/api-gateway:${GITHUB_SHA}" ./api-gateway

      - name: Build Auth Service image
        run: docker build --tag "city-app/auth-service:${GITHUB_SHA}" ./auth-service

      - name: Build Notification Service image
        run: docker build --tag "city-app/notification-service:${GITHUB_SHA}" ./notification-service

      - name: Build Eureka Server image
        run: docker build --tag "city-app/eureka-server:${GITHUB_SHA}" ./eureka-server

      - name: Build Main Backend image
        run: docker build --tag "city-app/city-app-backend:${GITHUB_SHA}" ./city-app-backend
