name: City App CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-images:
    name: Verify Maven, build, scan, and smoke test Docker images (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all Maven modules and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build API Gateway image
        run: docker build --tag "city-app/api-gateway:${GITHUB_SHA}" ./api-gateway

      - name: Build Auth Service image
        run: docker build --tag "city-app/auth-service:${GITHUB_SHA}" ./auth-service

      - name: Build Notification Service image
        run: docker build --tag "city-app/notification-service:${GITHUB_SHA}" ./notification-service

      - name: Build Eureka Server image
        run: docker build --tag "city-app/eureka-server:${GITHUB_SHA}" ./eureka-server

      - name: Build Main Backend image
        run: docker build --tag "city-app/city-app-backend:${GITHUB_SHA}" ./city-app-backend

      # Fail the CI job for fixable HIGH or CRITICAL image vulnerabilities.
      # Unfixed findings are reported but do not block the pipeline.
      - name: Scan API Gateway image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: city-app/api-gateway:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Auth Service image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: city-app/auth-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Notification Service image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: city-app/notification-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Eureka Server image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: city-app/eureka-server:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Main Backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: city-app/city-app-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Prepare smoke-test environment
        run: cp .env.example .env

      - name: Start application and infrastructure containers
        run: |
          IMAGE_TAG="${GITHUB_SHA}" docker compose \
            -p cityapp-ci \
            -f docker-compose.yml \
            -f docker-compose.ci-smoke.yml \
            --profile infra --profile core \
            up -d --no-build

      - name: Smoke test all five service health endpoints
        run: bash scripts/ci/docker-smoke-test.sh

      - name: Stop smoke-test containers
        if: always()
        run: |
          if [ -f .env ]; then
            IMAGE_TAG="${GITHUB_SHA}" docker compose \
              -p cityapp-ci \
              -f docker-compose.yml \
              -f docker-compose.ci-smoke.yml \
              --profile infra --profile core \
              down --volumes --remove-orphans
          fi
