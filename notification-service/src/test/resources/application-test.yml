spring:
  application:
    name: notification-service-test
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 1025
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-only-jwt-secret-012345678901234567890123456789
  fcm:
    credentials-path:

logging:
  level:
    com.cityapp: WARN
