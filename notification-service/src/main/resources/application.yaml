server:
  port: 8083

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cityapp}
    # Shares the same DB as main-service during strangler fig phase.
    username: ${DB_USERNAME:cityapp}
    password: ${DB_PASSWORD:cityapp}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:cityapp-kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.cityapp.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5

app:
  jwt:
    secret: ${JWT_SECRET}

  fcm:
    credentials-path: ${APP_FCM_CREDENTIALS_PATH:-}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.cityapp: INFO
    org.hibernate.SQL: OFF
    org.springframework.cache: WARN
    org.springframework.boot.context.properties: DEBUG