apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: city-app
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: city-app/auth-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DB_URL
              value: "jdbc:postgresql://host.docker.internal:5433/cityapp"
            - name: DB_USERNAME
              value: "cityapp"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: city-app-auth-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: "host.docker.internal"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BROKERS
              value: "host.docker.internal:29092"
            - name: EUREKA_HOST
              value: "eureka-server"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: city-app-auth-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
