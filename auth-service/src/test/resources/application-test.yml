spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-only-jwt-secret-012345678901234567890123456789
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000

logging:
  level:
    com.cityapp: WARN
    org.springframework.security: WARN
