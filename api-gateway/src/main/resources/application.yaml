server:
  port: 8000

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service-cb
                    fallbackUri: forward:/fallback/auth
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@ipKeyResolver}"

            - id: notification-service-route
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/device-tokens/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service-cb
                    fallbackUri: forward:/fallback/notification

            - id: main-service-route
              uri: lb://main-service
              predicates:
                - Path=/**
#              filters:
#                - name: CircuitBreaker
#                  args:
#                    name: main-service-cb
#                    fallbackUri: forward:/fallback/main

          default-filters:
            # Do not use X-Gateway-Request as an authentication signal.
            # Downstream services authenticate the original JWT themselves.
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000

resilience4j:
  circuitbreaker:
    instances:
      auth-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      notification-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      main-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 15s
  timelimiter:
    instances:
      auth-service-cb:
        timeoutDuration: 10s
      notification-service-cb:
        timeoutDuration: 10s
      main-service-cb:
        timeoutDuration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    gateway:
      access: read_only

logging:
  level:
    com.cityapp: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.context.properties: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
